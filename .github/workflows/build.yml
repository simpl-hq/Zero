name: build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - stable
    tags:
      - "v*"
      - "!*-fdroid"
      - "!*-armv7a"
  pull_request:
    paths:
      - "src/**"
      - "apps/zero-runtime/**"
      - "apps/zero-bot/**"
      - "apps/zero-bot-advanced/**"
      - "apps/zero-broadcast-bot/**"
      - "apps/zero-directory-service/**"
      - "tests/**"
      - "bots/src/**"
      - "zero-runtime.cabal"
      - "cabal.project"
      - "Dockerfile*"
      - "scripts/ci/**"
      - "scripts/desktop/**"
      - ".github/**"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

# This workflow uses custom actions (prepare-build and prepare-release) defined in:
# 
# .github/actions/
# ├── prepare-build
# │   └── action.yml
# └── prepare-release
#     └── action.yml

# Important!
# Do not use always(), it makes build unskippable.
# See: https://github.com/actions/runner/issues/1846#issuecomment-1246102753

jobs:

# =============================
#       Global variables
# =============================

# That is the only and less hacky way to setup global variables
# to use in strategy matrix (env:/YAML anchors doesn't work).
# See: https://github.com/orgs/community/discussions/56787#discussioncomment-6041789
#      https://github.com/actions/runner/issues/1182
#      https://stackoverflow.com/a/77549656

  variables:
    runs-on: ubuntu-latest
    outputs:
      GHC_VER: 9.6.3
      JAVA_VER: 17
    steps:
      - name: Dummy job when we have just simple variables
        if: false
        run: echo

# =============================
#       Create release
# =============================

# Create release, but only if it's triggered by tag push.
# On pull requests/commits push, this job will always complete.

  maybe-release:
    runs-on: ubuntu-latest
    steps:
      - name: Clone project
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@v3

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Zero ${{ github.ref_name }}"
          body_path: .github/RELEASE_TEMPLATE.md
          prerelease: ${{ contains(github.ref, '-') }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# =========================
#        Linux Build
# =========================

  build-linux:
    name: "ubuntu-${{ matrix.os }}-${{ matrix.arch }} (CLI,Desktop), GHC: ${{ matrix.ghc }}"
    needs: [maybe-release, variables]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: 22.04
            os_underscore: 22_04
            arch: x86_64
            runner: "ubuntu-22.04"
            should_run: true
            ghc: ${{ needs.variables.outputs.GHC_VER }}
            hash: 'sha256:5c8b2c0a6c745bc177669abfaa716b4bc57d58e2ea3882fb5da67f4d59e3dda5'
          - os: 24.04
            os_underscore: 24_04
            arch: x86_64
            runner: "ubuntu-24.04"
            should_run: true
            ghc: ${{ needs.variables.outputs.GHC_VER }}
            hash: 'sha256:98ff7968124952e719a8a69bb3cccdd217f5fe758108ac4f21ad22e1df44d237'
          - os: 22.04
            os_underscore: 22_04
            arch: aarch64
            runner: "ubuntu-22.04-arm"
            should_run: true
            ghc: ${{ needs.variables.outputs.GHC_VER }}
            hash: 'sha256:6a62a4157b8775eaf4959cb629e757d32d39d1f4c8ac1b0ddc2510b555cf72f3'
          - os: 24.04
            os_underscore: 24_04
            arch: aarch64
            runner: "ubuntu-24.04-arm"
            should_run: true
            ghc: ${{ needs.variables.outputs.GHC_VER }}
            hash: 'sha256:68434214381cb38287104e629fe8ee720167dd98cbb36ab1cbbab342515fa6ab'
    steps:
      - name: Checkout Code
        if: matrix.should_run == true
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup swap
        if: matrix.ghc == '8.10.7' && matrix.should_run == true
        uses: ./.github/actions/swap
        with:
          swap-size-gb: 30

      - name: Get UID and GID
        id: ids
        run: |
          echo "uid=$(id -u)" >> $GITHUB_OUTPUT
          echo "gid=$(id -g)" >> $GITHUB_OUTPUT

      # Otherwise we run out of disk space with Docker build
      - name: Free disk space
        if: matrix.should_run == true
        shell: bash
        run: ./scripts/ci/linux_util_free_space.sh

      - name: Restore cached build
        if: matrix.should_run == true
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ubuntu-${{ matrix.os }}-${{ matrix.arch }}-ghc${{ matrix.ghc }}-${{ hashFiles('cabal.project', 'zero-runtime.cabal') }}

      - name: Set up Docker Buildx
        if: matrix.should_run == true
        uses: docker/setup-buildx-action@v3

      - name: Build and cache Docker image
        if: matrix.should_run == true
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          file: Dockerfile.build
          tags: build/${{ matrix.os }}:latest
          build-args: |
            TAG=${{ matrix.os }}
            HASH=${{ matrix.hash }}
            GHC=${{ matrix.ghc }}
            USER_UID=${{ steps.ids.outputs.uid }}
            USER_GID=${{ steps.ids.outputs.gid }}

      # Docker needs these flags for AppImage build:
      # --device /dev/fuse
      # --cap-add SYS_ADMIN
      # --security-opt apparmor:unconfined
      - name: Start container
        if: matrix.should_run == true
        shell: bash
        run: |
          docker run -t -d \
            --device /dev/fuse \
            --cap-add SYS_ADMIN \
            --security-opt apparmor:unconfined \
            --name builder \
            -v ~/.cabal:/root/.cabal \
            -v /home/runner/work/_temp:/home/runner/work/_temp \
            -v ${{ github.workspace }}:/project \
            build/${{ matrix.os }}:latest

      - name: Prepare cabal.project.local
        if: matrix.should_run == true
        shell: bash
        run: |
          echo "ignore-project: False"    >> cabal.project.local
          echo "package direct-sqlcipher" >> cabal.project.local
          echo "    flags: +openssl"      >> cabal.project.local

      # chmod/git commands are used to workaround permission issues when cache is restored
      - name: Build CLI
        if: matrix.should_run == true
        shell: docker exec -t builder sh -eu {0}
        run: |
          cabal clean
          cabal update
          cabal build -j --enable-tests
          mkdir -p /out
          for i in zero-runtime zero-runtime-test; do
            bin=$(find /project/dist-newstyle -name "$i" -type f -executable)
            chmod +x "$bin"
            mv "$bin" /out/
          done
          strip /out/zero-runtime

      - name: Build CLI deb
        if: startsWith(github.ref, 'refs/tags/v') && matrix.should_run == true
        shell: docker exec -t builder sh -eu {0}
        run: |
          version=${{ github.ref }}
          version=${version#refs/tags/v}
          version=${version%-*}

          ./scripts/desktop/build-cli-deb.sh "$version"

      - name: Copy tests from container
        if: matrix.should_run == true
        shell: bash
        run: |
          docker cp builder:/out/zero-runtime-test .

      - name: Copy CLI from container and prepare it
        id: linux_cli_prepare
        if: startsWith(github.ref, 'refs/tags/v') && matrix.should_run == true
        shell: bash
        run: |
          cli_name="zero-runtime-ubuntu-${{ matrix.os_underscore }}-${{ matrix.arch }}"
          cli_deb_name="${cli_name}.deb"
          cli_path="${{ github.workspace }}"

          docker cp builder:/out/zero-runtime "./${cli_name}"
          docker cp builder:/out/deb-build/zero-runtime.deb "./${cli_deb_name}"

          echo "bin_name=${cli_name}" >> $GITHUB_OUTPUT
          echo "bin_path=${cli_path}/${cli_name}" >> $GITHUB_OUTPUT
          echo "bin_hash=$(echo SHA2-256\(${cli_name}\)= $(openssl sha256 "${cli_path}/${cli_name}" | cut -d' ' -f 2))" >> $GITHUB_OUTPUT

          echo "deb_name=${cli_deb_name}" >> $GITHUB_OUTPUT
          echo "deb_path=${cli_path}/${cli_deb_name}" >> $GITHUB_OUTPUT
          echo "deb_hash=$(echo SHA2-256\(${cli_deb_name}\)= $(openssl sha256 "${cli_path}/${cli_deb_name}" | cut -d' ' -f 2))" >> $GITHUB_OUTPUT

      - name: Upload CLI
        if: startsWith(github.ref, 'refs/tags/v') && matrix.should_run == true
        uses: ./.github/actions/prepare-release
        with:
          bin_name: ${{ steps.linux_cli_prepare.outputs.bin_name }}
          bin_path: ${{ steps.linux_cli_prepare.outputs.bin_path }}
          bin_hash: ${{ steps.linux_cli_prepare.outputs.bin_hash }}
          github_ref: ${{ github.ref }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload CLI deb
        if: startsWith(github.ref, 'refs/tags/v') && matrix.should_run == true
        uses: ./.github/actions/prepare-release
        with:
          bin_name: ${{ steps.linux_cli_prepare.outputs.deb_name }}
          bin_path: ${{ steps.linux_cli_prepare.outputs.deb_path }}
          bin_hash: ${{ steps.linux_cli_prepare.outputs.deb_hash }}
          github_ref: ${{ github.ref }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Desktop
        if: startsWith(github.ref, 'refs/tags/v') && matrix.should_run == true
        shell: docker exec -t builder sh -eu {0}
        run: |
          export ASSETS_DIR='../../assets'
          scripts/desktop/make-deb-linux.sh

      - name: Prepare Desktop
        id: linux_desktop_build
        if: startsWith(github.ref, 'refs/tags/v') && matrix.should_run == true
        shell: bash
        run: |
          path=$(echo ${{ github.workspace }}/apps/multiplatform/release/main/deb/zero_${{ matrix.arch }}.deb )
          echo "package_path=$path" >> $GITHUB_OUTPUT
          echo "package_hash=$(echo SHA2-256\(zero-desktop-ubuntu-${{ matrix.os_underscore }}-${{ matrix.arch }}.deb\)= $(openssl sha256 $path | cut -d' ' -f 2))" >> $GITHUB_OUTPUT

      - name: Upload Desktop
        uses: ./.github/actions/prepare-release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.should_run == true
        with:
          bin_path: ${{ steps.linux_desktop_build.outputs.package_path }}
          bin_name: zero-desktop-ubuntu-${{ matrix.os_underscore }}-${{ matrix.arch }}.deb
          bin_hash: ${{ steps.linux_desktop_build.outputs.package_hash }}
          github_ref: ${{ github.ref }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build AppImage
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == '22.04' && matrix.should_run == true
        shell: docker exec -t builder sh -eu {0}
        run: |
          export ASSETS_DIR='../../assets'
          scripts/desktop/make-appimage-linux.sh

      - name: Prepare AppImage
        id: linux_appimage_build
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == '22.04' && matrix.should_run == true
        shell: bash
        run: |
          path=$(echo ${{ github.workspace }}/apps/multiplatform/release/main/*.AppImage)
          echo "appimage_path=$path" >> $GITHUB_OUTPUT
          echo "appimage_hash=$(echo SHA2-256\(zero-desktop-${{ matrix.arch }}.AppImage\)= $(openssl sha256 $path | cut -d' ' -f 2))" >> $GITHUB_OUTPUT

      - name: Upload AppImage
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == '22.04' && matrix.should_run == true
        uses: ./.github/actions/prepare-release
        with:
          bin_path: ${{ steps.linux_appimage_build.outputs.appimage_path }}
          bin_name: "zero-desktop-${{ matrix.arch }}.AppImage"
          bin_hash: ${{ steps.linux_appimage_build.outputs.appimage_hash }}
          github_ref: ${{ github.ref }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix permissions for cache
        if: matrix.should_run == true
        shell: bash
        run: |
          sudo chmod -R 777 dist-newstyle ~/.cabal
          sudo chown -R $(id -u):$(id -g) dist-newstyle ~/.cabal

      - name: Run tests
        if: matrix.should_run == true && matrix.arch == 'x86_64'
        timeout-minutes: 120
        shell: bash
        run: |
          i=1
          attempts=1
          ${{ (github.ref == 'refs/heads/stable' || startsWith(github.ref, 'refs/tags/v')) }} && attempts=3
          while [ "$i" -le "$attempts" ]; do
            if ./zero-runtime-test; then
              break
            else
              echo "Attempt $i failed, retrying..."
              i=$((i + 1))
              sleep 1
            fi
          done
          if [ "$i" -gt "$attempts" ]; then
            echo "All "$attempts" attempts failed."
            exit 1
          fi

# =================================
#   Linux PostgreSQL Library Build
# =================================

  build-linux-postgres:
    name: "ubuntu-22.04-x86_64 (Postgres lib), GHC: ${{ needs.variables.outputs.GHC_VER }}"
    needs: [maybe-release, variables]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Get UID and GID
        id: ids
        run: |
          echo "uid=$(id -u)" >> $GITHUB_OUTPUT
          echo "gid=$(id -g)" >> $GITHUB_OUTPUT

      - name: Free disk space
        shell: bash
        run: ./scripts/ci/linux_util_free_space.sh

      - name: Restore cached build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ubuntu-22.04-x86_64-postgres-ghc${{ needs.variables.outputs.GHC_VER }}-${{ hashFiles('cabal.project', 'zero-runtime.cabal') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and cache Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          file: Dockerfile.build
          tags: build/22.04:latest
          build-args: |
            TAG=22.04
            HASH=sha256:5c8b2c0a6c745bc177669abfaa716b4bc57d58e2ea3882fb5da67f4d59e3dda5
            GHC=${{ needs.variables.outputs.GHC_VER }}
            USER_UID=${{ steps.ids.outputs.uid }}
            USER_GID=${{ steps.ids.outputs.gid }}

      - name: Start container
        shell: bash
        run: |
          docker run -t -d \
            --name builder \
            -v ~/.cabal:/root/.cabal \
            -v /home/runner/work/_temp:/home/runner/work/_temp \
            -v ${{ github.workspace }}:/project \
            build/22.04:latest

      - name: Prepare cabal.project.local
        shell: bash
        run: |
          echo "ignore-project: False"    >> cabal.project.local
          echo "package direct-sqlcipher" >> cabal.project.local
          echo "    flags: +openssl"      >> cabal.project.local

      - name: Build postgres library
        shell: docker exec -t builder sh -eu {0}
        run: |
          cabal clean
          cabal update
          scripts/desktop/build-lib-linux.sh postgres

      - name: Copy libs from container
        shell: bash
        run: |
          ARCH=x86_64
          GHC_VER=${{ needs.variables.outputs.GHC_VER }}
          BUILD_DIR=$(echo dist-newstyle/build/${ARCH}-linux/ghc-${GHC_VER}/zero-runtime-*)
          mkdir -p postgres-libs
          cp ${BUILD_DIR}/build/libzero.so postgres-libs/
          cp ${BUILD_DIR}/build/deps/* postgres-libs/

      - name: Upload postgres libs artifact
        uses: actions/upload-artifact@v4
        with:
          name: zero-libs-linux-postgres-x86_64
          path: postgres-libs/

      - name: Fix permissions for cache
        shell: bash
        run: |
          sudo chmod -R 777 dist-newstyle ~/.cabal
          sudo chown -R $(id -u):$(id -g) dist-newstyle ~/.cabal

# =========================
#        MacOS Build
# =========================

  build-macos:
    name: "${{ matrix.os }} (CLI,Desktop), GHC: ${{ matrix.ghc }}"
    needs: [maybe-release, variables]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            ghc: ${{ needs.variables.outputs.GHC_VER }}
            cli_asset_name: zero-runtime-macos-aarch64
            desktop_asset_name: zero-desktop-macos-aarch64.dmg
            openssl_dir: "/opt/homebrew/opt"
          - os: macos-15-intel
            ghc: ${{ needs.variables.outputs.GHC_VER }}
            cli_asset_name: zero-runtime-macos-x86-64
            desktop_asset_name: zero-desktop-macos-x86_64.dmg
            openssl_dir: "/usr/local/opt"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Prepare build
        uses: ./.github/actions/prepare-build
        with:
          java_ver: ${{ needs.variables.outputs.JAVA_VER }}
          ghc_ver: ${{ matrix.ghc }}
          os: ${{ matrix.os }}
          github_ref: ${{ github.ref }}

      - name: Install OpenSSL
        run: brew install openssl@3.0

      - name: Prepare cabal.project.local
        shell: bash
        run: |
          echo "ignore-project: False"                                                    >> cabal.project.local
          echo "package zeroq"                                                        >> cabal.project.local
          echo "    extra-include-dirs: ${{ matrix.openssl_dir }}/openssl@3.0/include"    >> cabal.project.local
          echo "    extra-lib-dirs: ${{ matrix.openssl_dir}}/openssl@3.0/lib"             >> cabal.project.local
          echo ""                                                                         >> cabal.project.local
          echo "package direct-sqlcipher"                                                 >> cabal.project.local
          echo "    extra-include-dirs: ${{ matrix.openssl_dir }}/openssl@3.0/include"    >> cabal.project.local
          echo "    extra-lib-dirs: ${{ matrix.openssl_dir }}/openssl@3.0/lib"            >> cabal.project.local
          echo "    flags: +openssl"                                                      >> cabal.project.local

      - name: Build CLI
        id: mac_cli_build
        shell: bash
        run: |
          cabal build -j --enable-tests
          path=$(cabal list-bin exe:zero-runtime | tail -n 1)
          echo "bin_path=$path" >> $GITHUB_OUTPUT
          echo "bin_hash=$(echo SHA2-256\(${{ matrix.cli_asset_name }}\)= $(openssl sha256 $path | cut -d' ' -f 2))" >> $GITHUB_OUTPUT

      - name: Upload CLI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ./.github/actions/prepare-release
        with:
          bin_path: ${{ steps.mac_cli_build.outputs.bin_path }}
          bin_name: ${{ matrix.cli_asset_name }}
          bin_hash: ${{ steps.mac_cli_build.outputs.bin_hash }}
          github_ref: ${{ github.ref }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Desktop
        id: mac_desktop_build
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          APPLE_ZERO_SIGNING_KEYCHAIN: ${{ secrets.APPLE_ZERO_SIGNING_KEYCHAIN }}
          APPLE_ZERO_NOTARIZATION_APPLE_ID: ${{ secrets.APPLE_ZERO_NOTARIZATION_APPLE_ID }}
          APPLE_ZERO_NOTARIZATION_PASSWORD: ${{ secrets.APPLE_ZERO_NOTARIZATION_PASSWORD }}
        run: |
          export ASSETS_DIR='../../assets'
          scripts/ci/build-desktop-mac.sh
          path=$(echo $PWD/apps/multiplatform/release/main/dmg/Zero-*.dmg)
          echo "package_path=$path" >> $GITHUB_OUTPUT
          echo "package_hash=$(echo SHA2-256\(${{ matrix.desktop_asset_name }}\)= $(openssl sha256 $path | cut -d' ' -f 2))" >> $GITHUB_OUTPUT

      - name: Upload Desktop
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ./.github/actions/prepare-release
        with:
          bin_path: ${{ steps.mac_desktop_build.outputs.package_path }}
          bin_name: ${{ matrix.desktop_asset_name }}
          bin_hash: ${{ steps.mac_desktop_build.outputs.package_hash }}
          github_ref: ${{ github.ref }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        timeout-minutes: 120
        shell: bash
        run: |
          i=1
          attempts=1
          ${{ (github.ref == 'refs/heads/stable' || startsWith(github.ref, 'refs/tags/v')) }} && attempts=3
          while [ "$i" -le "$attempts" ]; do
            if cabal test --test-show-details=direct; then
              break
            else
              echo "Attempt $i failed, retrying..."
              i=$((i + 1))
              sleep 1
            fi
          done
          if [ "$i" -gt "$attempts" ]; then
            echo "All "$attempts" attempts failed."
            exit 1
          fi

# =========================
#      Windows Build
# =========================

  build-windows:
    name: "${{ matrix.os }} (CLI,Desktop), GHC: ${{ matrix.ghc }}"
    needs: [maybe-release, variables]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ghc: ${{ needs.variables.outputs.GHC_VER }}
            cli_asset_name: zero-runtime-windows-x86-64
            desktop_asset_name: zero-desktop-windows-x86_64.msi
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Prepare build
        uses: ./.github/actions/prepare-build
        with:
          java_ver: ${{ needs.variables.outputs.JAVA_VER }}
          ghc_ver: ${{ matrix.ghc }}
          os: ${{ matrix.os }}
          cache_path: "C:/cabal"
          github_ref: ${{ github.ref }}

      - name: Configure pagefile (Windows)
        uses: al-cheb/configure-pagefile-action@v1.4
        with:
          minimum-size: 16GB
          maximum-size: 16GB
          disk-root: "C:"
  
      - name: 'Setup MSYS2'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          install: >-
            git
            perl
            make
          pacboy: >-
            toolchain:p
            cmake:p

      # rm -rf dist-newstyle/src/{direct-sq,zeroq}* is here because of the bug in cabal's dependency which prevents second build from finishing
      # (zeroq is removed because cabal cannot delete its read-only git submodule pack files - blst, libbbs - on Windows)
      - name: Build CLI
        id: windows_cli_build
        shell: msys2 {0}
        run: |
          export PATH=$PATH:/c/ghcup/bin:$(echo /c/tools/ghc-*/bin || echo)
          scripts/desktop/prepare-openssl-windows.sh
          openssl_windows_style_path=$(echo `pwd`/dist-newstyle/openssl-3.0.15 | sed 's#/\([a-zA-Z]\)#\1:#' | sed 's#/#\\#g')
          rm cabal.project.local 2>/dev/null || true
          echo "ignore-project: False" >> cabal.project.local
          echo "package zeroq" >> cabal.project.local
          echo "    extra-include-dirs: $openssl_windows_style_path\include" >> cabal.project.local
          echo "    extra-lib-dirs: $openssl_windows_style_path" >> cabal.project.local
          echo "package direct-sqlcipher" >> cabal.project.local
          echo "    flags: +openssl" >> cabal.project.local
          echo "    extra-include-dirs: $openssl_windows_style_path\include" >> cabal.project.local
          echo "    extra-lib-dirs: $openssl_windows_style_path" >> cabal.project.local

          rm -rf dist-newstyle/src/direct-sq* dist-newstyle/src/zeroq*
          sed -i "s/, unix /--, unix /" zero-runtime.cabal
          cabal build -j --enable-tests
          rm -rf dist-newstyle/src/direct-sq* dist-newstyle/src/zeroq*
          path=$(cabal list-bin exe:zero-runtime | tail -n 1)
          echo "bin_path=$path" >> $GITHUB_OUTPUT
          echo "bin_hash=$(echo SHA2-256\(${{ matrix.cli_asset_name }}\)= $(openssl sha256 $path | cut -d' ' -f 2))" >> $GITHUB_OUTPUT

      - name: Upload CLI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ./.github/actions/prepare-release
        with:
          bin_path: ${{ steps.windows_cli_build.outputs.bin_path }}
          bin_name: ${{ matrix.cli_asset_name }}
          bin_hash: ${{ steps.windows_cli_build.outputs.bin_hash }}
          github_ref: ${{ github.ref }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Desktop
        id: windows_desktop_build
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: msys2 {0}
        run: |
          export PATH=$PATH:/c/ghcup/bin:$(echo /c/tools/ghc-*/bin || echo)
          scripts/desktop/build-lib-windows.sh
          cd apps/multiplatform
          ./gradlew -Pzero.assets.dir=../../assets packageMsi
          rm -rf dist-newstyle/src/direct-sq* dist-newstyle/src/zeroq*
          path=$(echo $PWD/release/main/msi/*.msi | sed 's#/\([a-z]\)#\1:#' | sed 's#/#\\#g')
          echo "package_path=$path" >> $GITHUB_OUTPUT
          echo "package_hash=$(echo SHA2-256\(${{ matrix.desktop_asset_name }}\)= $(openssl sha256 $path | cut -d' ' -f 2))" >> $GITHUB_OUTPUT
          setup_path=$(echo $PWD/release/main/exe/*-setup.exe | sed 's#/\([a-z]\)#\1:#' | sed 's#/#\\#g')
          echo "setup_path=$setup_path" >> $GITHUB_OUTPUT
          echo "setup_hash=$(echo SHA2-256\(zero-desktop-windows-x86_64-setup.exe\)= $(openssl sha256 $setup_path | cut -d' ' -f 2))" >> $GITHUB_OUTPUT

      - name: Upload Desktop
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ./.github/actions/prepare-release
        with:
          bin_path: ${{ steps.windows_desktop_build.outputs.package_path }}
          bin_name: ${{ matrix.desktop_asset_name }}
          bin_hash: ${{ steps.windows_desktop_build.outputs.package_hash }}
          github_ref: ${{ github.ref }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Desktop Setup EXE
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ./.github/actions/prepare-release
        with:
          bin_path: ${{ steps.windows_desktop_build.outputs.setup_path }}
          bin_name: zero-desktop-windows-x86_64-setup.exe
          bin_hash: ${{ steps.windows_desktop_build.outputs.setup_hash }}
          github_ref: ${{ github.ref }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

# =========================
#       Android Build
# =========================

  build-android:
    name: "android-${{ matrix.android_abi }} (APK)"
    needs: [maybe-release, variables]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            android_abi: arm64-v8a
          - arch: armv7a
            android_abi: armeabi-v7a
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        shell: bash
        run: ./scripts/ci/linux_util_free_space.sh

      - name: Configure sysctl for Nix and 32-bit Android cross-build
        shell: bash
        run: |
          sudo sysctl -w kernel.pid_max=65535
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = auto
            extra-substituters = https://cache.iog.io
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Build Android native Haskell libraries (Nix)
        shell: bash
        run: |
          LIBS_DIR="apps/multiplatform/common/src/commonMain/cpp/android/libs/${{ matrix.android_abi }}"
          mkdir -p "$LIBS_DIR"
          nix build ".#hydraJobs.x86_64-linux.\"${{ matrix.arch }}-android:lib:zero-runtime\"" -o result-zero
          unzip -o "result-zero/pkg-${{ matrix.arch }}-android-libzero.zip" -d "$LIBS_DIR"
          nix build ".#hydraJobs.x86_64-linux.\"${{ matrix.arch }}-android:lib:support\"" -o result-support
          unzip -o "result-support/pkg-${{ matrix.arch }}-android-libsupport.zip" -d "$LIBS_DIR"
          rm -f result-zero result-support
          test -f "$LIBS_DIR/libzero.so" && test -f "$LIBS_DIR/libsupport.so"
          ls -lh "$LIBS_DIR"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: ${{ needs.variables.outputs.JAVA_VER }}

      - name: Ensure Android SDK directory permissions
        shell: bash
        run: sudo mkdir -p /usr/local/lib/android && sudo chown -R "$(id -u):$(id -g)" /usr/local/lib/android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;34.0.0" "ndk;23.1.7779620" "cmake;3.22.1"

      - name: Build Android APK
        id: android_apk_build
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SIGNED=false
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD}" ] && [ -n "${ANDROID_KEY_ALIAS}" ] && [ -n "${ANDROID_KEY_PASSWORD}" ]; then
            KEYSTORE_FILE="${RUNNER_TEMP}/zero-release.keystore"
            printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_FILE}"
            export ZERO_RELEASE_STORE_FILE="${KEYSTORE_FILE}"
            export ZERO_RELEASE_STORE_PASSWORD="${ANDROID_KEYSTORE_PASSWORD}"
            export ZERO_RELEASE_KEY_ALIAS="${ANDROID_KEY_ALIAS}"
            export ZERO_RELEASE_KEY_PASSWORD="${ANDROID_KEY_PASSWORD}"
            SIGNED=true
          fi

          cd apps/multiplatform
          ./gradlew -Pzero.assets.dir=../../assets -Pandroid.abi=${{ matrix.android_abi }} :android:assembleFossRelease --no-daemon

          if [ "${SIGNED}" = "true" ]; then
            ASSET_NAME="zero-android-${{ matrix.android_abi }}.apk"
            cp "android/build/outputs/apk/foss/release/android-foss-${{ matrix.android_abi }}-release.apk" "${GITHUB_WORKSPACE}/${ASSET_NAME}"
            "${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --print-certs "${GITHUB_WORKSPACE}/${ASSET_NAME}"
          else
            ASSET_NAME="zero-android-${{ matrix.android_abi }}-unsigned.apk"
            "${ANDROID_HOME}/build-tools/34.0.0/zipalign" -p -f 4 \
              "android/build/outputs/apk/foss/release/android-foss-${{ matrix.android_abi }}-release-unsigned.apk" \
              "${GITHUB_WORKSPACE}/${ASSET_NAME}"
          fi

          HASH=$(openssl sha256 "${GITHUB_WORKSPACE}/${ASSET_NAME}" | awk '{print $NF}')
          echo "apk_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_path=${GITHUB_WORKSPACE}/${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_hash=SHA2-256(${ASSET_NAME})= ${HASH}" >> "$GITHUB_OUTPUT"

      - name: Clean up temporary keystore
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/zero-release.keystore"

      - name: Upload Android APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ./.github/actions/prepare-release
        with:
          bin_path: ${{ steps.android_apk_build.outputs.apk_path }}
          bin_name: ${{ steps.android_apk_build.outputs.apk_name }}
          bin_hash: ${{ steps.android_apk_build.outputs.apk_hash }}
          github_ref: ${{ github.ref }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Android APK artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.android_apk_build.outputs.apk_name }}
          path: ${{ steps.android_apk_build.outputs.apk_path }}

# =========================
#  iOS Build (iPhone+iPad)
# =========================

  build-ios:
    name: "ios-universal (iPhone + iPad IPA)"
    needs: [maybe-release, variables]
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    timeout-minutes: 300
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = auto
            extra-substituters = https://cache.iog.io
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Build iOS Haskell static libraries (Nix)
        shell: bash
        run: |
          nix build '.#hydraJobs.aarch64-darwin."aarch64-darwin-ios:lib:zero-runtime"' -o result-ios
          mkdir -p apps/ios/Libraries/ios
          unzip -o result-ios/pkg-ios-aarch64-swift-json.zip -d apps/ios/Libraries/ios
          ls -lh apps/ios/Libraries/ios
          rm -f result-ios
          ./scripts/ios/update-pbxproj.sh

      - name: Build Universal iOS App (iPhone + iPad)
        id: ios_ipa_build
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project apps/ios/Zero.xcodeproj \
            -scheme "Zero (iOS)" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/ios \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            VALIDATE_PRODUCT=NO \
            build

          APP_PATH="build/ios/Build/Products/Release-iphoneos/Zero.app"
          test -d "$APP_PATH"
          /usr/libexec/PlistBuddy -c "Print :UIDeviceFamily" "$APP_PATH/Info.plist"

          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/Zero.app
          (cd build/ipa && zip -qry "$GITHUB_WORKSPACE/zero-ios-universal.ipa" Payload)

          HASH=$(openssl sha256 "$GITHUB_WORKSPACE/zero-ios-universal.ipa" | awk '{print $NF}')
          echo "ipa_name=zero-ios-universal.ipa" >> "$GITHUB_OUTPUT"
          echo "ipa_path=$GITHUB_WORKSPACE/zero-ios-universal.ipa" >> "$GITHUB_OUTPUT"
          echo "ipa_hash=SHA2-256(zero-ios-universal.ipa)= ${HASH}" >> "$GITHUB_OUTPUT"

      - name: Upload iOS Universal IPA to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ./.github/actions/prepare-release
        with:
          bin_path: ${{ steps.ios_ipa_build.outputs.ipa_path }}
          bin_name: ${{ steps.ios_ipa_build.outputs.ipa_name }}
          bin_hash: ${{ steps.ios_ipa_build.outputs.ipa_hash }}
          github_ref: ${{ github.ref }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload iOS Universal IPA artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ios_ipa_build.outputs.ipa_name }}
          path: ${{ steps.ios_ipa_build.outputs.ipa_path }}

# =========================
#   Checksums + PGP sign
# =========================
# Runs on tag pushes only, after every platform build. Publishes SHA256SUMS and,
# when PGP secrets exist, a detached signature SHA256SUMS.asc to the release.
# Secrets: RELEASE_PGP_PRIVATE_KEY (armored), RELEASE_PGP_PASSPHRASE (optional)

  release-checksums:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [maybe-release, build-linux, build-macos, build-windows, build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir assets && cd assets
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --pattern 'zero-*' --pattern '*.AppImage' --pattern '*.deb' --pattern '*.msi' --pattern '*.dmg' --pattern '*.apk' --pattern '*.ipa' --pattern '*.exe' || true
          ls -la

      - name: Generate SHA256SUMS
        run: |
          cd assets
          sha256sum * | grep -v -e SHA256SUMS > SHA256SUMS
          cat SHA256SUMS

      - name: PGP-sign SHA256SUMS
        env:
          PGP_KEY: ${{ secrets.RELEASE_PGP_PRIVATE_KEY }}
          PGP_PASS: ${{ secrets.RELEASE_PGP_PASSPHRASE }}
        run: |
          cd assets
          if [ -z "${PGP_KEY}" ]; then echo "No RELEASE_PGP_PRIVATE_KEY set; publishing unsigned SHA256SUMS"; exit 0; fi
          export GNUPGHOME="$(mktemp -d)"
          printf '%s' "${PGP_KEY}" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "${PGP_PASS}" --armor --detach-sign -o SHA256SUMS.asc SHA256SUMS
          gpg --armor --export > zero-release-public-key.asc

      - name: Upload checksums to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/SHA256SUMS
            assets/SHA256SUMS.asc
            assets/zero-release-public-key.asc
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# =========================
#   NodeJS libs release
# =========================

# Downloads Desktop builds, extracts and archives libraries for NodeJS addon.
# Depends on Linux/MacOS, executes only on release.

# Secrets:
# -------
# NODEJS_REPO_TOKEN
#  Only select repositories: zero-runtime-libs 
#  Permissions:
#   * Contents (Read and Write)

  release-nodejs-libs:
    runs-on: ubuntu-latest
    needs: [build-linux, build-linux-postgres, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') && (!cancelled())
    steps:
      - name: Check NodeJS libs release token
        id: check_token
        env:
          TOKEN: ${{ secrets.NODEJS_REPO_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping release-nodejs-libs: NODEJS_REPO_TOKEN secret is not configured."
          fi

      - name: Checkout current repository
        if: steps.check_token.outputs.enabled == 'true'
        uses: actions/checkout@v6

      - name: Install packages for archiving
        if: steps.check_token.outputs.enabled == 'true'
        run: sudo apt install -y msitools gcc-mingw-w64

      - name: Download postgres libs artifact
        if: steps.check_token.outputs.enabled == 'true' && needs.build-linux-postgres.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: zero-libs-linux-postgres-x86_64
          path: ${{ runner.temp }}/postgres-libs

      - name: Build archives
        if: steps.check_token.outputs.enabled == 'true'
        run: |
          INIT_DIR='${{ runner.temp }}/artifacts'
          RELEASE_DIR='${{ runner.temp }}/release-assets'
          TAG='${{ github.ref_name }}'
          URL='https://github.com/${{ github.repository }}/releases/download'
          PREFIX='${{ github.event.repository.name }}-libs'
          # Windows-specific
          FILE_URL='https://raw.githubusercontent.com/${{ github.repository }}/refs/tags/${{ github.ref_name }}'

          # Setup directories
          mkdir "$INIT_DIR" "$RELEASE_DIR" && cd "$INIT_DIR"

          # Downlaod desktop release
          curl --proto '=https' --tlsv1.2 -sSf -L "${URL}/${TAG}/zero-desktop-ubuntu-22_04-x86_64.deb" -o linux.deb
          curl --proto '=https' --tlsv1.2 -sSf -L "${URL}/${TAG}/zero-desktop-macos-aarch64.dmg" -o macos-aarch64.dmg
          curl --proto '=https' --tlsv1.2 -sSf -L "${URL}/${TAG}/zero-desktop-macos-x86_64.dmg" -o macos-x86_64.dmg
          curl --proto '=https' --tlsv1.2 -sSf -L "${URL}/${TAG}/zero-desktop-windows-x86_64.msi" -o windows-x86_64.msi

          # Linux
          # -----
          # Extract libraries
          dpkg-deb -R linux.deb linux-out/ && cd linux-out/opt/zero/lib/app/resources
          # Preprare directory
          mkdir libs && cp *.so libs/
          # Archive
          zip -r "${PREFIX}-linux-x86_64.zip" libs
          # Back to original dir
          mv "${PREFIX}-linux-x86_64.zip" "$RELEASE_DIR" && cd "$INIT_DIR"

          # MacOS: aarch64
          # --------------
          7z x macos-aarch64.dmg -omacos1-out/ && cd macos1-out/Zero/Zero.app/Contents/app/resources/
          mkdir libs && cp *.dylib libs/
          zip -r "${PREFIX}-macos-aarch64.zip" libs
          mv "${PREFIX}-macos-aarch64.zip" "$RELEASE_DIR" && cd "$INIT_DIR"

          # Macos: x86_64
          # -------------
          7z x macos-x86_64.dmg -omacos2-out/ && cd macos2-out/Zero/Zero.app/Contents/app/resources/
          mkdir libs && cp *.dylib libs/
          zip -r "${PREFIX}-macos-x86_64.zip" libs
          mv "${PREFIX}-macos-x86_64.zip" "$RELEASE_DIR" && cd "$INIT_DIR"

          # Windows: x86_64
          # ---------------
          msiextract windows-x86_64.msi -C windows-out && cd windows-out/Zero/app/resources

          # We need to generate library that exports symbols from Windows dll
          curl --proto '=https' --tlsv1.2 -sSf -LO "${FILE_URL}/libzero.dll.def"
          x86_64-w64-mingw32-dlltool -d libzero.dll.def -l libzero.lib -D libzero.dll

          mkdir libs && cp *.dll *.lib libs/
          zip -r "${PREFIX}-windows-x86_64.zip" libs
          mv "${PREFIX}-windows-x86_64.zip" "$RELEASE_DIR" && cd "$INIT_DIR"

          # Linux PostgreSQL (only if postgres build succeeded)
          # -------------------------------------------------
          POSTGRES_LIBS='${{ runner.temp }}/postgres-libs'
          if [ -d "$POSTGRES_LIBS" ]; then
            mkdir -p linux-postgres/libs
            cp "${POSTGRES_LIBS}"/*.so linux-postgres/libs/
            cd linux-postgres
            zip -r "${PREFIX}-linux-x86_64-postgres.zip" libs
            mv "${PREFIX}-linux-x86_64-postgres.zip" "$RELEASE_DIR" && cd "$INIT_DIR"
          fi

      - name: Create release in libs repo and upload artifacts
        if: steps.check_token.outputs.enabled == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.repository }}-libs
          tag_name: ${{ github.ref_name }}
          files: ${{ runner.temp }}/release-assets/*
          token: ${{ secrets.NODEJS_REPO_TOKEN }}
