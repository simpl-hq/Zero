# Coturn overflow TURN configuration (Media Node) with HMAC auth and private subnet filters.
listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
static-auth-secret=REPLACE_WITH_SHARED_TURN_AUTH_SECRET
realm=zeromedia.simpl.global
# After Caddy obtains TLS certs and permissions are synced for coturn, uncomment:
# cert=/certs/caddy/certificates/acme-v02.api.letsencrypt.org-directory/zeromedia.simpl.global/zeromedia.simpl.global.crt
# pkey=/certs/caddy/certificates/acme-v02.api.letsencrypt.org-directory/zeromedia.simpl.global/zeromedia.simpl.global.key
no-stdout-log
log-file=/dev/null
simple-log=0
no-cli

denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
