# Node 4 (Media Relay): Caddy TLS proxy and Coturn overflow TURN (no persistent admin state).
services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  coturn:
    image: coturn/coturn:4.6-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
      - caddy_data:/certs:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]

volumes:
  caddy_data:
  caddy_config:
