# PostgreSQL 16 (WireGuard-only): SCRAM-SHA-256 auth, statement/connection logging disabled, sized for 2 GB RAM KVM.
listen_addresses = '*'
max_connections = 100
shared_buffers = 512MB
effective_cache_size = 1GB
work_mem = 8MB
maintenance_work_mem = 128MB
wal_buffers = 16MB
checkpoint_completion_target = 0.9
password_encryption = scram-sha-256
logging_collector = off
log_statement = 'none'
log_connections = off
log_disconnections = off
