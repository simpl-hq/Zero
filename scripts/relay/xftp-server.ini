# Reference XFTP server configuration (install as /etc/opt/zero-xftp/file-server.ini).
# Copy server certificates (ca.crt, server.crt, server.key, fingerprint) generated by `xftp-server init`.

[INFORMATION]
source_code = https://github.com/simpl-hq/zero/tree/main/vendor/zeroq
hosting_type = virtual

[STORE_LOG]
enable = off
store_files = memory
expire_files_hours = 24
log_stats = off

[AUTH]
new_files = on

[TRANSPORT]
host = zerocdn.simpl.global
port = 5223
log_tls_errors = off

[FILES]
path = /mnt/zero-blobs
storage_quota = 12gb

[INACTIVE_CLIENTS]
disconnect = off
# ttl = 21600
# check_interval = 3600
