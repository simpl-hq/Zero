# Nginx reverse proxy template for Zero API edge nodes with access logs disabled.

server {
    listen 80;
    server_name zeroapi.simpl.global zerona.simpl.global zeroeu.simpl.global;
    access_log off;
    error_log /dev/null crit;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
    }
}
