# Reference SMP server configuration (/etc/opt/zero/smp-server.ini) for edge relays.
# Copy server certificates (ca.crt, server.crt, server.key, fingerprint) generated by `smp-server init`.

[INFORMATION]
source_code = https://github.com/simpl-hq/zero/tree/main/vendor/zeroq
hosting_type = virtual

[STORE_LOG]
enable = off
store_queues = memory
store_messages = memory
restore_messages = off
expire_messages_days = 2
expire_messages_on_start = on
expire_messages_on_send = on
expire_ntfs_hours = 12
log_stats = off

[AUTH]
new_queues = on

[TRANSPORT]
host = zerorelay.simpl.global
port = 5223
log_tls_errors = off
websockets = off

[INACTIVE_CLIENTS]
disconnect = on
ttl = 21600
check_interval = 3600

[WEB]
static_path = /var/opt/zero/www
# Caddy owns :80/:443 on edge nodes:
# https = 443
