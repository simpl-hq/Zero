# Coturn standalone TURN configuration with HMAC ephemeral auth and private subnet filters.

listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
static-auth-secret=REPLACE_WITH_SHARED_TURN_AUTH_SECRET
realm=zeroturn.simpl.global
cert=/etc/letsencrypt/live/zeroturn.simpl.global/fullchain.pem
pkey=/etc/letsencrypt/live/zeroturn.simpl.global/privkey.pem
no-stdout-log
log-file=/dev/null
simple-log=0
no-cli

denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
